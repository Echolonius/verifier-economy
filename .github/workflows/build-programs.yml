name: build-programs

# Builds the Anchor workspace (escrow + arbiter + verifier) and publishes the compiled
# .so + IDL as artifacts, so the devnet deploy is reproducible from CI output.
on:
  push:
    branches: [verifier-economy, main]
    paths:
      - "examples/txodds/escrow/**"
      - ".github/workflows/build-programs.yml"
  workflow_dispatch:

jobs:
  anchor-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/txodds/escrow
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # v2: never cache target/ — a cached target from the key-synced `anchor build` (run 1)
          # poisoned later cargo build-sbf runs, which skipped the rebuild and shipped binaries
          # declaring the wrong program id (on-chain: DeclaredProgramIdMismatch).
          key: anchor-v2-${{ runner.os }}-${{ hashFiles('examples/txodds/escrow/Cargo.toml', 'examples/txodds/escrow/programs/**/Cargo.toml') }}

      - name: Install Anchor CLI 0.32.1
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libudev-dev
          npm install -g @coral-xyz/anchor-cli@0.32.1 || cargo install anchor-cli --version 0.32.1 --locked

      # NOT a plain `anchor build`: on a fresh checkout it generates target/deploy keypairs and
      # key-syncs, rewriting every declare_id! — which would point the verifier's CPI at a
      # nonexistent escrow. So: binaries via cargo build-sbf (compiles exactly the declared ids),
      # IDLs via `anchor build` in a throwaway copy (right shapes, wrong addresses), then the
      # address fields are pinned back to the declared ids.
      - name: build programs (cargo build-sbf)
        run: cargo build-sbf

      - name: build IDLs (anchor build in a throwaway copy, addresses pinned back)
        run: |
          rm -rf /tmp/idlbuild && cp -r . /tmp/idlbuild
          (cd /tmp/idlbuild && anchor build)
          mkdir -p target/idl
          declare -A ids=(
            [escrow]="R5NWNg9eRLWWQU81Xbzz5Du1k7jTDeeT92Ty6qCeXet"
            [arbiter]="FJtuVXsyXuRKqgJBEPAXmktkd13CqStapgevzGwYktXd"
            [verifier]="2ce3cMxqi423wQjC5NXNMBExa1PpybtCnLUs8uFtUvqn"
          )
          for p in escrow arbiter verifier; do
            jq --arg addr "${ids[$p]}" '.address = $addr' "/tmp/idlbuild/target/idl/$p.json" > "target/idl/$p.json"
          done

      - name: Upload program + IDL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: programs
          path: |
            examples/txodds/escrow/target/deploy/*.so
            examples/txodds/escrow/target/idl/*.json
          if-no-files-found: error
