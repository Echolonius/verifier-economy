[package]
name = "verifier"
version = "0.1.0"
description = "Verifier - per-order paid arbitration over the escrow: any agent can be the neutral verifier, chosen at open, paid on either verdict"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "escrow/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
# the escrow crate, with its `cpi` feature so we can call escrow::cpi::{initialize,release,refund}
escrow = { path = "../escrow", features = ["cpi"] }
